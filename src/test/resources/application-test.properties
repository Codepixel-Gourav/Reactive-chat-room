spring.datasource.url=jdbc:h2:mem:chat_engine;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
chat.outbox.initial-delay-ms=60000
chat.jwt.secret=test-jwt-secret-which-is-at-least-32-bytes-long
chat.jwt.ttl=PT15M
chat.allowed-origins=http://localhost:5173,http://localhost:8080

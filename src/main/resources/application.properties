spring.main.allow-circular-references=true

server.port=${PORT:8080}
spring.application.name=reactive-chat-engine

spring.datasource.url=jdbc:mysql://localhost:3306/chat_engine_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=gourav.jv9588
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:30}
spring.datasource.hikari.minimum-idle=5
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

chat.jwt.secret=${JWT_SECRET:local-development-secret-change-this-32-bytes-minimum}
chat.jwt.ttl=PT15M
chat.allowed-origins=${CHAT_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}
chat.rate-limit.messages-per-minute=${CHAT_MESSAGES_PER_MINUTE:30}
chat.rate-limit.typing-per-minute=${CHAT_TYPING_PER_MINUTE:60}
chat.rate-limit.receipts-per-minute=${CHAT_RECEIPTS_PER_MINUTE:300}
chat.rate-limit.room-joins-per-minute=${CHAT_ROOM_JOINS_PER_MINUTE:30}
chat.rate-limit.handshake-per-minute=${CHAT_HANDSHAKES_PER_MINUTE:20}

server.tomcat.threads.max=300
server.tomcat.max-connections=10000
spring.jackson.deserialization.fail-on-unknown-properties=true

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: chat_engine
      MYSQL_USER: chat
      MYSQL_PASSWORD: chat
      MYSQL_ROOT_PASSWORD: local-root-password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uchat", "-pchat"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql_data:

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: chat_engine
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat_engine"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
